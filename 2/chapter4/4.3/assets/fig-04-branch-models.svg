<rect x="40" y="598" width="420" height="162" rx="12" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
<text x="64" y="628" font-size="14.5" fill="#047857" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >เดินจาก o ขึ้นไป a ตามกิ่งที่ 2</text>
<text x="64" y="656" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >ผ่านแหล่งจ่ายจาก – ไป + ได้ +v<tspan font-size="8.8" baseline-shift="sub">s</tspan>  แล้วตกคร่อม R₁ เท่ากับ R₁i₂</text>
<text x="250" y="690" font-size="18" fill="#16181d" text-anchor="middle" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">v(a) - v(o) = v<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan> - R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan></text>
<rect x="60" y="708" width="382" height="40" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="250" y="735" font-size="18" fill="#047857" text-anchor="middle" font-weight="600" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">v<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan> = v(o) - v(a) = R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan> - v<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan></text>
<rect x="480" y="598" width="420" height="162" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="504" y="628" font-size="14.5" fill="#1d4ed8" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >กระแสในกิ่งที่ 1 แยกเป็นสองทาง</text>
<text x="504" y="656" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >ส่วนที่ผ่าน R₂+R₃ คือ i<tspan font-size="8.8" baseline-shift="sub">R</tspan> = i₁ − i<tspan font-size="8.8" baseline-shift="sub">s</tspan>  ตกคร่อมเท่ากับ (R₂+R₃)i<tspan font-size="8.8" baseline-shift="sub">R</tspan></text>
<text x="690" y="690" font-size="18" fill="#16181d" text-anchor="middle" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">v(o) - v(a) = (R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan> + R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">3</tspan>)(i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> - i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan>)</text>
<rect x="500" y="708" width="382" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="690" y="735" font-size="18" fill="#1d4ed8" text-anchor="middle" font-weight="600" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">v<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> = (R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan> + R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">3</tspan>)(i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> - i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan>)</text>
