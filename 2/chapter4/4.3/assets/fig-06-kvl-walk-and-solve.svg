<text x="486" y="347" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >3</text>
<text x="508" y="347" font-size="13.5" fill="#6b7280" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >รวมพจน์ที่มี j₁ ไว้ข้างเดียวกัน</text>
<text x="682" y="382" font-size="17" fill="#16181d" text-anchor="middle" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">(R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">1</tspan>+R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">3</tspan>) j<tspan font-size="11.2" baseline-shift="sub" font-style="normal">1</tspan> = (R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">3</tspan>)i<tspan font-size="11.2" baseline-shift="sub" font-style="normal">s</tspan> - v<tspan font-size="11.2" baseline-shift="sub" font-style="normal">s</tspan></text>
<rect x="464" y="440" width="436" height="80" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2.4"/>
<text x="682" y="468" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >คำตอบของกระแสวงรอบ</text>
<text x="682" y="500" font-size="17" fill="#16181d" text-anchor="middle" font-weight="600" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">j<tspan font-size="11.2" baseline-shift="sub" font-style="normal">1</tspan> = [ (R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">3</tspan>)i<tspan font-size="11.2" baseline-shift="sub" font-style="normal">s</tspan> - v<tspan font-size="11.2" baseline-shift="sub" font-style="normal">s</tspan> ] / (R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">1</tspan>+R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">3</tspan>)</text>
<rect x="40" y="586" width="860" height="130" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="64" y="616" font-size="15" fill="#16181d" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >อ่านผลลัพธ์เดียวกันนี้ในรูปเมทริกซ์</text>
<text x="64" y="652" font-size="17" fill="#16181d" text-anchor="start" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">loop</tspan> = B R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">b</tspan> B<tspan font-size="11.2" baseline-shift="super" font-style="normal">⊤</tspan> = R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">1</tspan> + R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">2</tspan> + R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">3</tspan></text>
<text x="64" y="690" font-size="17" fill="#16181d" text-anchor="start" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">loop</tspan> j = B R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">b</tspan> i<tspan font-size="11.2" baseline-shift="sub" font-style="normal">sb</tspan> + B v<tspan font-size="11.2" baseline-shift="sub" font-style="normal">sb</tspan> = (R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">3</tspan>)i<tspan font-size="11.2" baseline-shift="sub" font-style="normal">s</tspan> - v<tspan font-size="11.2" baseline-shift="sub" font-style="normal">s</tspan></text>
<text x="560" y="652" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >ความต้านทานวงรอบ = ผลรวมความต้านทานรอบวง</text>
<text x="560" y="690" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >ฝั่งขวา = แรงดันขับรวมรอบวง</text>
