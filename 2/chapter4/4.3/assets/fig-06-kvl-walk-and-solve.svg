<circle cx="235" cy="360" r="9" fill="#16181d"/>
<text x="253" y="156" font-size="18" fill="#16181d" text-anchor="start" font-weight="700" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">a</text>
<text x="253" y="388" font-size="18" fill="#16181d" text-anchor="start" font-weight="700" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">o</text>
<text x="137.8" y="271" font-size="22" fill="#111827" text-anchor="end" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >2</text>
<text x="332.2" y="271" font-size="22" fill="#c0392b" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >1</text>
<circle cx="241" cy="265" r="40" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 6"/>
<polygon points="201,272.5 194.5,257.5 207.5,257.5" fill="#c0392b"/>
<text x="255" y="272" font-size="20" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">j<tspan font-size="13.2" baseline-shift="sub" font-style="normal">1</tspan></text>
<circle cx="339" cy="203" r="14" fill="#c0392b"/>
<text x="339" y="208" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >1</text>
<circle cx="131" cy="327" r="14" fill="#111827"/>
<text x="131" y="332" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >2</text>
<circle cx="68" cy="412" r="12" fill="#c0392b"/>
<text x="68" y="417" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >1</text>
<text x="90" y="417" font-size="14" fill="#c0392b" text-anchor="start" font-weight="600" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >o → a  ตามลูกศรกิ่ง 1 (ตามทิศ j₁)  ⇒  +v₁</text>
<circle cx="68" cy="442" r="12" fill="#111827"/>
<text x="68" y="447" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >2</text>
<text x="90" y="447" font-size="14" fill="#111827" text-anchor="start" font-weight="600" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >a → o  สวนลูกศรกิ่ง 2 (ตามทิศ j₁)  ⇒  −v₂</text>
<rect x="40" y="466" width="400" height="100" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="62" y="494" font-size="14.5" fill="#16181d" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >ผลรวมแรงดันรอบวงรอบต้องเป็นศูนย์</text>
<text x="240" y="538" font-size="19" fill="#16181d" text-anchor="middle" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">(+1)v<tspan font-size="12.5" baseline-shift="sub" font-style="normal">1</tspan> + (-1)v<tspan font-size="12.5" baseline-shift="sub" font-style="normal">2</tspan> = 0</text>
<text x="464" y="86" font-size="16" fill="#16181d" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >แก้สมการทีละบรรทัด</text>
<rect x="464" y="104" width="436" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="486" cy="130" r="13" fill="#eef2ff"/>
<text x="486" y="135" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >1</text>
<text x="508" y="135" font-size="13.5" fill="#6b7280" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >แทนสมการเฉพาะกิ่งของแต่ละกิ่ง</text>
<text x="682" y="170" font-size="17" fill="#16181d" text-anchor="middle" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">(R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">3</tspan>)(i<tspan font-size="11.2" baseline-shift="sub" font-style="normal">1</tspan> - i<tspan font-size="11.2" baseline-shift="sub" font-style="normal">s</tspan>) - (R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">1</tspan> i<tspan font-size="11.2" baseline-shift="sub" font-style="normal">2</tspan> - v<tspan font-size="11.2" baseline-shift="sub" font-style="normal">s</tspan>) = 0</text>
<line x1="682" y1="188" x2="682" y2="206" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="464" y="210" width="436" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="486" cy="236" r="13" fill="#eef2ff"/>
<text x="486" y="241" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >2</text>
<text x="508" y="241" font-size="13.5" fill="#6b7280" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >แทนการแปลงกระแส  i₁ = j₁ ,  i₂ = −j₁</text>
<text x="682" y="276" font-size="17" fill="#16181d" text-anchor="middle" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">(R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">3</tspan>)(j<tspan font-size="11.2" baseline-shift="sub" font-style="normal">1</tspan> - i<tspan font-size="11.2" baseline-shift="sub" font-style="normal">s</tspan>) + R<tspan font-size="11.2" baseline-shift="sub" font-style="normal">1</tspan> j<tspan font-size="11.2" baseline-shift="sub" font-style="normal">1</tspan> + v<tspan font-size="11.2" baseline-shift="sub" font-style="normal">s</tspan> = 0</text>
<line x1="682" y1="294" x2="682" y2="312" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="464" y="316" width="436" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
