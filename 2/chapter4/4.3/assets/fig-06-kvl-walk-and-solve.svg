  <rect width="940" height="740" fill="#ffffff"/>
<text x="470.0" y="38" font-size="20" fill="#16181d" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >รูปที่ 6 — เดินรอบวงรอบเก็บเครื่องหมาย แล้วแก้หา j₁</text>
<path d="M 235 360 Q 100 265 235 170" fill="none" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
