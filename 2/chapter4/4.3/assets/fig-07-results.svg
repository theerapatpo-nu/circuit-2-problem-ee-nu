<text x="270" y="511" font-size="18" fill="#16181d" text-anchor="start" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> = + j<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> = [ (R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">3</tspan>)i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan> - v<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan> ] / R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">T</tspan></text>
<rect x="50" y="540" width="840" height="54" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="74" y="573" font-size="14.5" fill="#047857" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >กระแสกิ่งที่ 2</text>
<text x="270" y="575" font-size="18" fill="#16181d" text-anchor="start" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan> = - j<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> = [ v<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan> - (R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">3</tspan>)i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan> ] / R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">T</tspan></text>
<rect x="50" y="604" width="840" height="54" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="74" y="637" font-size="14.5" fill="#16181d" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >แรงดันกิ่งทั้งสอง</text>
<text x="270" y="639" font-size="18" fill="#16181d" text-anchor="start" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">v<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> = v<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan> = -(R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">3</tspan>)(v<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan> + R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan>) / R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">T</tspan></text>
<text x="470.0" y="700" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >เครื่องหมายลบของ v₁, v₂ มาจากการวางขั้ว + ไว้ที่ปม o</text>
<text x="470.0" y="722" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >แรงดันของปม a เทียบปม o คือ  v(a) = (R₂+R₃)(v<tspan font-size="9.2" baseline-shift="sub">s</tspan> + R₁i<tspan font-size="9.2" baseline-shift="sub">s</tspan>) / R<tspan font-size="9.2" baseline-shift="sub">T</tspan>  ซึ่งเป็นบวก</text>
