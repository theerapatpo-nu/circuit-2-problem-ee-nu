<text x="270" y="447" font-size="18" fill="#16181d" text-anchor="start" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">j<tspan font-size="11.9" baseline-shift="sub" font-style="normal">1</tspan> = [ (R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">3</tspan>)i<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan> - v<tspan font-size="11.9" baseline-shift="sub" font-style="normal">s</tspan> ] / R<tspan font-size="11.9" baseline-shift="sub" font-style="normal">T</tspan></text>
