<text x="620" y="132" font-size="15" fill="#16181d" text-anchor="middle" font-weight="600" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >3 Ω</text>
<text x="793" y="266" font-size="15" fill="#16181d" text-anchor="start" font-weight="600" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >5 Ω</text>
<text x="161" y="266" font-size="15" fill="#16181d" text-anchor="end" font-weight="600" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >10 V</text>
<text x="515" y="266" font-size="15" fill="#16181d" text-anchor="start" font-weight="600" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >4 A</text>
<circle cx="485" cy="150" r="6" fill="#16181d"/>
<circle cx="485" cy="370" r="6" fill="#16181d"/>
<text x="471" y="138" font-size="17" fill="#16181d" text-anchor="end" font-weight="700" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">a</text>
<text x="471" y="394" font-size="17" fill="#16181d" text-anchor="end" font-weight="700" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">o</text>
<text x="519" y="190" font-size="14" fill="#7c3aed" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >v(a) = 14.4 V</text>
<line x1="225" y1="205" x2="225" y2="325" stroke="#047857" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="237" y="254" font-size="14" fill="#047857" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >2.2 A</text>
<text x="237" y="274" font-size="12" fill="#047857" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >(ผ่าน R₁ และ v<tspan font-size="8.2" baseline-shift="sub">s</tspan>)</text>
<line x1="735" y1="205" x2="735" y2="325" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="723" y="254" font-size="14" fill="#1d4ed8" text-anchor="end" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >1.8 A</text>
<text x="723" y="274" font-size="12" fill="#1d4ed8" text-anchor="end" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >(ผ่าน R₂ และ R₃)</text>
<rect x="50" y="412" width="400" height="168" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="74" y="442" font-size="15" fill="#16181d" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >ตรวจที่ 1 — วิธีปม (KCL ที่ปม a)</text>
<text x="74" y="478" font-size="16" fill="#16181d" text-anchor="start" font-weight="400" font-style="italic" font-family="'Latin Modern Math','Cambria Math','Times New Roman',Georgia,serif">[v(a) - v<tspan font-size="10.6" baseline-shift="sub" font-style="normal">s</tspan>] / R<tspan font-size="10.6" baseline-shift="sub" font-style="normal">1</tspan> + v(a) / (R<tspan font-size="10.6" baseline-shift="sub" font-style="normal">2</tspan>+R<tspan font-size="10.6" baseline-shift="sub" font-style="normal">3</tspan>) = i<tspan font-size="10.6" baseline-shift="sub" font-style="normal">s</tspan></text>
<text x="74" y="512" font-size="15" fill="#16181d" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >(14.4 − 10)/2 + 14.4/8 = 2.2 + 1.8 = 4 A</text>
<text x="74" y="546" font-size="15" fill="#047857" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >เท่ากับ i<tspan font-size="10.2" baseline-shift="sub">s</tspan> พอดี ✓</text>
<rect x="490" y="412" width="400" height="168" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="514" y="442" font-size="15" fill="#16181d" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >ตรวจที่ 2 — แทนตัวเลขในสูตรที่ได้</text>
<text x="514" y="478" font-size="15" fill="#16181d" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >j₁ = (8 × 4 − 10) / 10 = 2.2 A</text>
<text x="514" y="512" font-size="15" fill="#16181d" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >v₁ = v₂ = −8(10 + 2×4)/10 = −14.4 V</text>
<text x="514" y="546" font-size="15" fill="#047857" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >i₁ = +2.2 A ,  i₂ = −2.2 A ✓</text>
<rect x="50" y="606" width="840" height="212" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="74" y="636" font-size="15" fill="#16181d" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >ตรวจที่ 3 — สมดุลกำลัง (กำลังที่จ่าย = กำลังที่ดูดกลืน)</text>
<text x="74" y="668" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >จ่ายโดยแหล่งกำเนิดกระแส</text>
<rect x="90" y="676" width="760" height="34" rx="6" fill="#7c3aed"/>
<text x="470.0" y="699" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >i<tspan font-size="9.5" baseline-shift="sub">s</tspan> จ่าย  4 A × 14.4 V = 57.6 W</text>
<text x="74" y="744" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >ถูกดูดกลืนโดย</text>
<rect x="90.0" y="752" width="290.3" height="34" rx="6" fill="#b45309"/>
<text x="235.13888888888889" y="775" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >v<tspan font-size="8.5" baseline-shift="sub">s</tspan>  22 W</text>
<rect x="380.3" y="752" width="127.7" height="34" rx="6" fill="#0f766e"/>
<text x="444.1388888888889" y="775" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >R₁  9.68 W</text>
<rect x="508.0" y="752" width="128.2" height="34" rx="6" fill="#1d4ed8"/>
<text x="572.125" y="775" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >R₂  9.72 W</text>
<rect x="636.2" y="752" width="213.8" height="34" rx="6" fill="#7e22ce"/>
<text x="743.125" y="775" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >R₃  16.2 W</text>
<text x="470.0" y="806" font-size="14" fill="#047857" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >รวม 22 + 9.68 + 9.72 + 16.2 = 57.6 W  ตรงกับกำลังที่จ่าย ✓</text>
</svg>
