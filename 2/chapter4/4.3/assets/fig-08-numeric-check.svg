<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 850" width="940" height="850"
     font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" role="img" aria-label="ตัวอย่างตัวเลขและการตรวจคำตอบ">
  <title>ตัวอย่างตัวเลขและการตรวจคำตอบ</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="940" height="850" fill="#ffffff"/>
<text x="470.0" y="36" font-size="20" fill="#16181d" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >รูปที่ 8 — แทนตัวเลขเพื่อทดสอบสูตร แล้วตรวจด้วยวิธีปมและสมดุลกำลัง</text>
<text x="470.0" y="60" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >กำหนด  R₁ = 2 Ω,  R₂ = 3 Ω,  R₃ = 5 Ω,  v<tspan font-size="9.5" baseline-shift="sub">s</tspan> = 10 V,  i<tspan font-size="9.5" baseline-shift="sub">s</tspan> = 4 A   ⇒   R<tspan font-size="9.5" baseline-shift="sub">T</tspan> = 10 Ω,  R₂+R₃ = 8 Ω</text>
<path d="M 870 300 L 870 112 Q 870 98 854 98 L 116 98 Q 100 98 100 112 L 100 300" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah)" stroke-dasharray="9 6"/>
<text x="485.0" y="88" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif" >j<tspan font-size="11.6" baseline-shift="sub">1</tspan> = 2.2 A</text>
