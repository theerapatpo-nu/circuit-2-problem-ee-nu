<text x="544.0" y="166.0" font-size="14" fill="#64748b" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">เติมลิงก์ 1 กลับลงในทรี T={2,3}</text>
<text x="544.0" y="193.0" font-size="14" fill="#64748b" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">ได้วงรอบ O → B → A → O</text>
<text x="544.0" y="220.0" font-size="14" fill="#64748b" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">จำนวนตัวแปรอิสระ l=b−n+1=1</text>
<text x="752.0" y="270.0" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">B = [ 1   1   −1 ]</text>
<text x="752.0" y="308.0" font-size="19" fill="#172033" text-anchor="middle" font-weight="600" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Bv = 0  •  i = Bᵀj</text>
<rect x="515.0" y="360.0" width="475.0" height="245.0" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
