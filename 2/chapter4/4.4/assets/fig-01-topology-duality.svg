<text x="570.0" y="396.0" font-size="16" fill="#172033" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">Cut-set / Fundamental cut-set</text>
<text x="544.0" y="434.0" font-size="14" fill="#64748b" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">ตัดทวิก 2 และ 3 ออกจากทรีทีละกิ่ง</text>
<text x="544.0" y="461.0" font-size="14" fill="#64748b" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">ได้ชุดตัดอิสระ 2 ชุด</text>
<text x="544.0" y="488.0" font-size="14" fill="#64748b" text-anchor="start" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">จำนวนตัวแปรแรงดันทวิก n−1=2</text>
<text x="752.0" y="538.0" font-size="22" fill="#059669" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Q = [ −1  1  0 ;  1  0  1 ]</text>
<text x="752.0" y="576.0" font-size="19" fill="#172033" text-anchor="middle" font-weight="600" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Qi = 0  •  v = Q^T e_t</text>
<rect x="75.0" y="618.0" width="890.0" height="78.0" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
<text x="520.0" y="654.0" font-size="25" fill="#b45309" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">B Qᵀ = 0</text>
<text x="520.0" y="681.0" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">cycle space ⟂ cut space — รากฐานของ KVL, KCL และ Tellegen</text>
