<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 730" width="1040" height="730" role="img" aria-label="การประกอบและแก้สมการวงรอบแบบเมทริกซ์" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">
<title>การประกอบและแก้สมการวงรอบแบบเมทริกซ์</title>
<defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172033"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/></marker><marker id="arr-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111827"/></marker></defs>
<rect width="1040" height="730" fill="#ffffff"/>
<text x="520.0" y="38.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">รูปที่ 5 — จากสมการกิ่งสู่ B Z_b Bᵀ j</text>
<text x="520.0" y="64.0" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">ประกอบทีละก้อนเพื่อลดความผิดพลาดเรื่องเครื่องหมายของแหล่งจ่าย</text>
<rect x="70.0" y="102.0" width="900.0" height="105.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="108.0" cy="154.0" r="22.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="108.0" y="161.0" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">1</text>
<text x="148.0" y="139.0" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">สมการกิ่ง</text>
<text x="520.0" y="177.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">v = Z_b i + v_sb − Z_b i_sb</text>
<rect x="70.0" y="227.0" width="900.0" height="105.0" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="108.0" cy="279.0" r="22.0" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="108.0" y="286.0" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">2</text>
<text x="148.0" y="264.0" font-size="15" fill="#059669" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">แทนข้อบังคับโทโพโลยี</text>
<text x="520.0" y="302.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Bv=0  และ  i=Bᵀj</text>
<rect x="70.0" y="352.0" width="900.0" height="105.0" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<circle cx="108.0" cy="404.0" r="22.0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="108.0" y="411.0" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">3</text>
<text x="148.0" y="389.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">ย้ายพจน์แหล่งจ่าย</text>
<text x="520.0" y="427.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">B Z_b Bᵀ j = B Z_b i_sb − B v_sb</text>
<rect x="70.0" y="488.0" width="280.0" height="150.0" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
<text x="90.0" y="520.0" font-size="15" fill="#2563eb" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">Loop impedance</text>
<text x="210.0" y="562.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="400" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">B Z_b Bᵀ = R_T</text>
<text x="210.0" y="598.0" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">R_T = R₁+R₂+R₃</text>
<rect x="380.0" y="488.0" width="280.0" height="150.0" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
<text x="400.0" y="520.0" font-size="15" fill="#0891b2" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">Norton drive</text>
<text x="520.0" y="562.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="400" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">B Z_b i_sb</text>
<text x="520.0" y="598.0" font-size="17" fill="#64748b" text-anchor="middle" font-weight="400" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">= (R₂+R₃)i_s</text>
<rect x="690.0" y="488.0" width="280.0" height="150.0" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
<text x="710.0" y="520.0" font-size="15" fill="#7c3aed" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">Thévenin drive</text>
<text x="830.0" y="562.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="400" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">−B v_sb</text>
<text x="830.0" y="598.0" font-size="17" fill="#64748b" text-anchor="middle" font-weight="400" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">= −v_s</text>
<rect x="150.0" y="658.0" width="740.0" height="52.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="520.0" y="692.0" font-size="23" fill="#b45309" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">R_T j₁ = (R₂+R₃)i_s − v_s</text>
</svg>
