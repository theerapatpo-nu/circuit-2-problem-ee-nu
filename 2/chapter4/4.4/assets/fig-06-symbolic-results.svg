<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760" role="img" aria-label="คำตอบเชิงสัญลักษณ์" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">
<title>คำตอบเชิงสัญลักษณ์</title>
<defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172033"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/></marker><marker id="arr-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111827"/></marker></defs>
<rect width="1040" height="760" fill="#ffffff"/>
<text x="520.0" y="38.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">รูปที่ 6 — คำตอบครบทุกกระแสกิ่งและแรงดันกิ่ง</text>
<text x="520.0" y="64.0" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">ให้ R_T=R₁+R₂+R₃ และ K=v_s+R₁i_s</text>
<path d="M 285 462.25 L 132.75 213.39999999999998" fill="none" stroke="#111827" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 437.25 213.39999999999998 L 132.75 213.39999999999998" fill="none" stroke="#111827" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 285 462.25 L 437.25 213.39999999999998" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="321.8" y1="402.4" x2="364.8" y2="332.0" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arr-red)"/>
<line x1="324.9" y1="213.4" x2="245.1" y2="213.4" stroke="#111827" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arr-black)"/>
<line x1="248.2" y1="402.4" x2="205.2" y2="332.0" stroke="#111827" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arr-black)"/>
<circle cx="132.8" cy="213.4" r="6.5" fill="#172033" stroke="#172033" stroke-width="1"/>
<text x="118.0" y="194.5" font-size="18" fill="#172033" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">A</text>
<circle cx="437.2" cy="213.4" r="6.5" fill="#172033" stroke="#172033" stroke-width="1"/>
<text x="451.9" y="194.5" font-size="18" fill="#172033" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">B</text>
<circle cx="285.0" cy="462.2" r="6.5" fill="#172033" stroke="#172033" stroke-width="1"/>
<text x="285.0" y="493.8" font-size="18" fill="#172033" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">O</text>
<text x="398.4" y="328.9" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">1</text>
<text x="285.0" y="197.6" font-size="22" fill="#111827" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">2</text>
<text x="171.6" y="328.9" font-size="22" fill="#111827" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">3</text>
<path d="M 297.6 430.75 L 414.15 225.99999999999997 L 155.85 225.99999999999997 L 272.4 430.75" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arr-red)"/>
<text x="291.3" y="339.4" font-size="20" fill="#dc2626" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">j₁</text>
<rect x="540.0" y="92.0" width="440.0" height="305.0" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
<text x="565.0" y="128.0" font-size="17" fill="#2563eb" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">กระแส</text>
<text x="760.0" y="172.0" font-size="20" fill="#dc2626" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">j₁ = [(R₂+R₃)i_s−v_s] / R_T</text>
<text x="760.0" y="222.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">i₁ = i₂ = j₁</text>
<text x="760.0" y="272.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">i₃ = −j₁</text>
<rect x="574.0" y="308.0" width="372.0" height="58.0" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="760.0" y="343.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">ค่าลบ = ไหลจริงสวนลูกศรอ้างอิง</text>
<rect x="540.0" y="420.0" width="440.0" height="285.0" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
<text x="565.0" y="456.0" font-size="17" fill="#059669" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">แรงดัน</text>
<text x="760.0" y="504.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">v₁ = −R₃K / R_T</text>
<text x="760.0" y="548.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">v₂ = −R₂K / R_T</text>
<text x="760.0" y="592.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">v₃ = −(R₂+R₃)K / R_T</text>
<text x="760.0" y="648.0" font-size="20" fill="#059669" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">v₁ + v₂ − v₃ = 0  ✓</text>
<text x="760.0" y="682.0" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">V_B=−v₁ • V_A=−v₃</text>
<rect x="60.0" y="590.0" width="440.0" height="115.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="82.0" y="622.0" font-size="15" fill="#b45309" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">กระแสระดับองค์ประกอบ</text>
<text x="280.0" y="660.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="400" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">i_R₂ = i_R₃ = −K / R_T</text>
<text x="280.0" y="688.0" font-size="13.5" fill="#64748b" text-anchor="middle" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">เมื่อ K&gt;0 กระแสจริงไหล A → B → O</text>
</svg>
