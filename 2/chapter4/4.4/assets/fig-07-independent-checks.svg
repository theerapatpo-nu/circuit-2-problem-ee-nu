<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" role="img" aria-label="การตรวจคำตอบอิสระสี่ทาง" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">
<title>การตรวจคำตอบอิสระสี่ทาง</title>
<defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172033"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/></marker><marker id="arr-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#111827"/></marker></defs>
<rect width="1040" height="720" fill="#ffffff"/>
<text x="520.0" y="38.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">รูปที่ 7 — การตรวจคำตอบอิสระ 4 ทาง</text>
<text x="520.0" y="64.0" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">KCL • Mesh constraints • พฤติกรรมขีดจำกัด • Tellegen</text>
<rect x="45.0" y="100.0" width="465.0" height="250.0" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="75.0" cy="137.0" r="15.0" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="75.0" y="142.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">1</text>
<text x="101.0" y="142.0" font-size="16" fill="#172033" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">Node Analysis</text>
<line x1="67.0" y1="168.0" x2="488.0" y2="168.0" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round"/>
<text x="277.0" y="212.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="500" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">(V_A−v_s)/R₁ + (V_A−V_B)/R₂ = i_s</text>
<text x="277.0" y="258.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="500" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">(V_B−V_A)/R₂ + V_B/R₃ = 0</text>
<text x="277.0" y="304.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">⇒ V_A=(R₂+R₃)K/R_T</text>
<text x="465.0" y="328.0" font-size="24" fill="#2563eb" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">✓</text>
<rect x="530.0" y="100.0" width="465.0" height="250.0" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<circle cx="560.0" cy="137.0" r="15.0" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="560.0" y="142.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">2</text>
<text x="586.0" y="142.0" font-size="16" fill="#172033" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">Mesh / Supermesh</text>
<line x1="552.0" y1="168.0" x2="973.0" y2="168.0" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round"/>
<text x="762.0" y="212.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="500" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">m₂=m₃=−i_s</text>
<text x="762.0" y="258.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="500" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">−v_s+R₁m₀+(R₂+R₃)(m₀+i_s)=0</text>
<text x="762.0" y="304.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">⇒ m₀=i₃=−j₁</text>
<text x="950.0" y="328.0" font-size="24" fill="#7c3aed" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">✓</text>
<rect x="45.0" y="390.0" width="465.0" height="250.0" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<circle cx="75.0" cy="427.0" r="15.0" fill="#b45309" stroke="#b45309" stroke-width="1"/>
<text x="75.0" y="432.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">3</text>
<text x="101.0" y="432.0" font-size="16" fill="#172033" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">Limiting Cases</text>
<line x1="67.0" y1="458.0" x2="488.0" y2="458.0" stroke="#b45309" stroke-width="1.2" stroke-linecap="round"/>
<text x="277.0" y="502.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="500" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">i_s=0  ⇒  i₃=v_s/R_T</text>
<text x="277.0" y="548.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="500" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">R₁→0  ⇒  V_A→v_s</text>
<text x="277.0" y="594.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">v_s=(R₂+R₃)i_s  ⇒  j₁=0</text>
<text x="465.0" y="618.0" font-size="24" fill="#b45309" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">✓</text>
<rect x="530.0" y="390.0" width="465.0" height="250.0" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="560.0" cy="427.0" r="15.0" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="560.0" y="432.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">4</text>
<text x="586.0" y="432.0" font-size="16" fill="#172033" text-anchor="start" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">Tellegen / Power</text>
<line x1="552.0" y1="458.0" x2="973.0" y2="458.0" stroke="#059669" stroke-width="1.2" stroke-linecap="round"/>
<text x="762.0" y="502.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="500" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">vᵀi = vᵀBᵀj</text>
<text x="762.0" y="548.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="500" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">= (Bv)ᵀj = 0</text>
<text x="762.0" y="594.0" font-size="17.5" fill="#172033" text-anchor="middle" font-weight="700" font-style="italic" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">กำลังดูดกลืนรวม = กำลังจ่ายรวม</text>
<text x="950.0" y="618.0" font-size="24" fill="#059669" text-anchor="middle" font-weight="700" font-style="normal" font-family="'Sarabun','Noto Sans Thai','IBM Plex Sans Thai','Segoe UI',sans-serif">✓</text>
</svg>
