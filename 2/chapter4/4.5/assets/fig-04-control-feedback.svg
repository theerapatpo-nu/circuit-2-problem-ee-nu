<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-label="ตัวแปรควบคุมและ CCCS ในโจทย์ 4.5" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">
<title>ตัวแปรควบคุมและ CCCS ในโจทย์ 4.5</title><defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172033"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/></marker><marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<rect width="1200" height="690" fill="#ffffff"/>
<text x="54.0" y="55.0" font-size="29" fill="#172033" text-anchor="start" font-weight="800" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">ตัวแปรควบคุมคือวงป้อนกลับ</text>
<text x="54.0" y="86.0" font-size="16" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">กิ่ง 3 ให้ iₓ — จากนั้น iₓ ควบคุมแหล่งในกิ่ง 2</text>
<line x1="54" y1="105" x2="1146" y2="105" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<rect x="60" y="155" width="315" height="400" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="90.0" y="198.0" font-size="20" fill="#2563eb" text-anchor="start" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">กิ่ง 3: KCL ภายใน</text>
<line x1="205" y1="475" x2="205" y2="245" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<text x="174.0" y="360.0" font-size="22" fill="#2563eb" text-anchor="end" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">I₀</text>
<line x1="285" y1="245" x2="285" y2="475" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="315.0" y="360.0" font-size="22" fill="#dc2626" text-anchor="start" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">iₓ</text>
<line x1="120" y1="475" x2="120" y2="265" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-green)"/>
<text x="93.0" y="370.0" font-size="22" fill="#059669" text-anchor="end" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">i₃</text>
<text x="217.0" y="520.0" font-size="23" fill="#172033" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">i₃ = I₀ − iₓ</text>
<line x1="395" y1="350" x2="485" y2="350" stroke="#0891b2" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-cyan)"/>
<rect x="500" y="155" width="270" height="400" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="530.0" y="198.0" font-size="20" fill="#7c3aed" text-anchor="start" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">ใช้ topology</text>
<text x="635.0" y="280.0" font-size="28" fill="#7c3aed" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">i₃ = −j₁</text>
<line x1="545" y1="320" x2="725" y2="320" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<text x="635.0" y="385.0" font-size="24" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">iₓ = I₀ − i₃</text>
<text x="635.0" y="445.0" font-size="30" fill="#7c3aed" text-anchor="middle" font-weight="800" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">iₓ = I₀ + j₁</text>
<rect x="558" y="485" width="155" height="38" rx="19" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="635.5" y="510.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">CONTROL EQ.</text>
<line x1="790" y1="350" x2="880" y2="350" stroke="#0891b2" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-cyan)"/>
<rect x="895" y="155" width="250" height="400" rx="18" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="925.0" y="198.0" font-size="20" fill="#b45309" text-anchor="start" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">กิ่ง 2: CCCS</text>
<circle cx="1020" cy="310" r="55" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
<line x1="1050" y1="310" x2="990" y2="310" stroke="#b45309" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-amber)"/>
<text x="1020.0" y="395.0" font-size="30" fill="#b45309" text-anchor="middle" font-weight="800" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">αiₓ</text>
<text x="1020.0" y="465.0" font-size="22" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">v₂=R₂(j₁−αiₓ)</text>
<text x="600.0" y="625.0" font-size="19" fill="#64748b" text-anchor="middle" font-weight="600" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">ระบบจะปิดได้เมื่อสมการวงรอบและสมการควบคุมอยู่ใน matrix เดียวกัน</text>
</svg>
