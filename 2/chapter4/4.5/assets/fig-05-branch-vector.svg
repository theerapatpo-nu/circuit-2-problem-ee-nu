<text x="622.0" y="260.0" font-size="28" fill="#7c3aed" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Zᵦ iₛᵦ</text>
<text x="622.0" y="318.0" font-size="23" fill="#172033" text-anchor="middle" font-weight="400" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ 0 ]</text>
<text x="622.0" y="355.0" font-size="23" fill="#172033" text-anchor="middle" font-weight="400" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ αR₂iₓ ]</text>
<text x="622.0" y="392.0" font-size="23" fill="#172033" text-anchor="middle" font-weight="400" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ R₁I₀ ]</text>
<text x="485.0" y="475.0" font-size="16" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">กิ่ง 1: ไม่มี source</text>
