<text x="825.0" y="385.0" font-size="42" fill="#059669" text-anchor="middle" font-weight="800" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">=</text>
<rect x="855" y="145" width="290" height="470" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<rect x="885" y="175" width="120" height="38" rx="19" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="945.0" y="200.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">ผลลัพธ์ vᵦ</text>
<text x="1000.0" y="270.0" font-size="28" fill="#059669" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">vᵦ</text>
<text x="1000.0" y="330.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="400" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ R₃j₁ ]</text>
<text x="1000.0" y="370.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="400" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ R₂(j₁−αiₓ) ]</text>
<text x="1000.0" y="410.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="400" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ −R₁(j₁+I₀) ]</text>
<text x="885.0" y="500.0" font-size="16" fill="#64748b" text-anchor="start" font-weight="600" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">= [v₁  v₂  v₃]ᵀ</text>
<text x="885.0" y="531.0" font-size="16" fill="#64748b" text-anchor="start" font-weight="600" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">ตรงกับ scalar ทุกกิ่ง</text>
<text x="600.0" y="670.0" font-size="26" fill="#172033" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">vᵦ = Zᵦ iᵦ − Zᵦ iₛᵦ</text>
