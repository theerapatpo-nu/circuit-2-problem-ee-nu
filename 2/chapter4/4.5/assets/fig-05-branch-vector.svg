<text x="222.0" y="318.0" font-size="23" fill="#172033" text-anchor="middle" font-weight="400" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ R₃j₁ ]</text>
<text x="222.0" y="355.0" font-size="23" fill="#172033" text-anchor="middle" font-weight="400" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ R₂j₁ ]</text>
<text x="222.0" y="392.0" font-size="23" fill="#172033" text-anchor="middle" font-weight="400" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ −R₁j₁ ]</text>
