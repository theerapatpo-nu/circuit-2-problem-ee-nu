<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-label="แผนที่คำตอบเชิงสัญลักษณ์โจทย์ 4.5" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">
<title>แผนที่คำตอบเชิงสัญลักษณ์โจทย์ 4.5</title><defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172033"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/></marker><marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<rect width="1200" height="830" fill="#ffffff"/>
<text x="54.0" y="55.0" font-size="29" fill="#172033" text-anchor="start" font-weight="800" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">แผนที่คำตอบเชิงสัญลักษณ์</text>
<text x="54.0" y="86.0" font-size="16" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">กำหนด D=R₁+R₃+(1−α)R₂ และ D≠0</text>
<line x1="54" y1="105" x2="1146" y2="105" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<rect x="430" y="135" width="340" height="110" rx="18" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="600.0" y="180.0" font-size="24" fill="#b45309" text-anchor="middle" font-weight="800" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">D = R₁+R₃+(1−α)R₂</text>
<text x="600.0" y="220.0" font-size="16" fill="#64748b" text-anchor="middle" font-weight="500" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">common denominator</text>
<line x1="600" y1="250" x2="600" y2="300" stroke="#0891b2" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-cyan)"/>
<rect x="65" y="320" width="330" height="160" rx="18" fill="#f8fafc" stroke="#2563eb" stroke-width="1.7"/>
<rect x="87" y="342" width="145" height="38" rx="19" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="159.5" y="367.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">ตัวแปรหลัก</text>
<text x="230.0" y="415.0" font-size="19" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">j₁=(αR₂−R₁)I₀/D</text>
<text x="230.0" y="452.0" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">iₓ=(R₂+R₃)I₀/D</text>
<rect x="435" y="320" width="330" height="160" rx="18" fill="#f8fafc" stroke="#059669" stroke-width="1.7"/>
<rect x="457" y="342" width="145" height="38" rx="19" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="529.5" y="367.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">กระแสกิ่ง</text>
<text x="600.0" y="415.0" font-size="19" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">i₁=i₂=j₁</text>
<text x="600.0" y="452.0" font-size="18" fill="#059669" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">i₃=−j₁</text>
<rect x="805" y="320" width="330" height="160" rx="18" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.7"/>
<rect x="827" y="342" width="145" height="38" rx="19" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="899.5" y="367.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">แรงดันปม</text>
<text x="970.0" y="415.0" font-size="19" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Vₐ=R₁(R₂+R₃)I₀/D</text>
<text x="970.0" y="452.0" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Vᵦ=R₃(R₁−αR₂)I₀/D</text>
<rect x="65" y="540" width="330" height="200" rx="18" fill="#f8fafc" stroke="#dc2626" stroke-width="1.7"/>
<rect x="87" y="562" width="145" height="38" rx="19" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="159.5" y="587.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">แรงดันกิ่ง 1</text>
<text x="230.0" y="635.0" font-size="19" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">v₁=R₃j₁</text>
<text x="230.0" y="672.0" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">=R₃(αR₂−R₁)I₀/D</text>
<rect x="435" y="540" width="330" height="200" rx="18" fill="#f8fafc" stroke="#b45309" stroke-width="1.7"/>
<rect x="457" y="562" width="145" height="38" rx="19" fill="#b45309" stroke="#b45309" stroke-width="1"/>
<text x="529.5" y="587.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">แรงดันกิ่ง 2</text>
<text x="600.0" y="635.0" font-size="19" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">v₂=R₂(j₁−αiₓ)</text>
<text x="600.0" y="672.0" font-size="18" fill="#b45309" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">=−R₂(R₁+αR₃)I₀/D</text>
<rect x="805" y="540" width="330" height="200" rx="18" fill="#f8fafc" stroke="#0891b2" stroke-width="1.7"/>
<rect x="827" y="562" width="145" height="38" rx="19" fill="#0891b2" stroke="#0891b2" stroke-width="1"/>
<text x="899.5" y="587.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">แรงดันกิ่ง 3</text>
<text x="970.0" y="635.0" font-size="19" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">v₃=−R₁iₓ</text>
<text x="970.0" y="672.0" font-size="18" fill="#0891b2" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">=−R₁(R₂+R₃)I₀/D</text>
<text x="600.0" y="795.0" font-size="17" fill="#64748b" text-anchor="middle" font-weight="600" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">ขั้วแรงดันกิ่ง: + ที่ต้นลูกศร และ − ที่ปลายลูกศร</text>
</svg>
