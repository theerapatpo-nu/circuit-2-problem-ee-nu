<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-label="การคูณเมทริกซ์วงรอบเชิงซ้อน" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">
<title>การคูณเมทริกซ์วงรอบเชิงซ้อน</title><defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172033"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/></marker><marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<rect width="1200" height="850" fill="#ffffff"/>
<text x="54.0" y="55.0" font-size="29" fill="#172033" text-anchor="start" font-weight="800" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">Complex Matrix Engine</text>
<text x="54.0" y="86.0" font-size="16" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">คูณสามก้อนและเห็นที่มาของทุกสัมประสิทธิ์</text>
<line x1="54" y1="105" x2="1146" y2="105" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<rect x="50" y="135" width="1100" height="185" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="75" y="158" width="150" height="38" rx="19" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="150.0" y="183.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">1  LOOP MATRIX</text>
<text x="220.0" y="235.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">BZᵦBᵀ</text>
<text x="220.0" y="282.0" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[R₁+ZL   ZL;  ZL   R₂+ZC+ZL]</text>
<rect x="420" y="158" width="150" height="38" rx="19" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="495.0" y="183.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">2  NORTON</text>
<text x="565.0" y="235.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">BZᵦIₛᵦ</text>
<text x="565.0" y="282.0" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ 0;  jR₂I₀ ]</text>
<rect x="790" y="158" width="150" height="38" rx="19" fill="#b45309" stroke="#b45309" stroke-width="1"/>
<text x="865.0" y="183.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">3  THÉVENIN</text>
<text x="935.0" y="235.0" font-size="21" fill="#172033" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">−BVₛᵦ</text>
<text x="935.0" y="282.0" font-size="18" fill="#b45309" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ −V₀;  0 ]</text>
<line x1="600" y1="335" x2="600" y2="390" stroke="#0891b2" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-cyan)"/>
<rect x="105" y="405" width="990" height="280" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="140" y="435" width="185" height="38" rx="19" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="232.5" y="460.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">LOOP SYSTEM 2×2</text>
<text x="600.0" y="525.0" font-size="27" fill="#172033" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[ R₁+ZL       ZL       ] [ J₁ ]   =   [ −V₀      ]</text>
<text x="600.0" y="575.0" font-size="27" fill="#172033" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">[   ZL    R₂+ZC+ZL ] [ J₂ ]       [ jR₂I₀ ]</text>
<line x1="155" y1="615" x2="1045" y2="615" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<text x="600.0" y="657.0" font-size="24" fill="#dc2626" text-anchor="middle" font-weight="800" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Δ=(R₁+ZL)(R₂+ZC+ZL)−ZL²</text>
<rect x="115" y="725" width="970" height="78" rx="15" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="600.0" y="760.0" font-size="21" fill="#059669" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Δ = [R₁R₂+L/C] + j[ωL(R₁+R₂)−R₁/(ωC)]</text>
<text x="600.0" y="789.0" font-size="15" fill="#64748b" text-anchor="middle" font-weight="600" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">Re{Δ}&gt;0 เมื่อ R₁,R₂,L,C&gt;0  ⇒  ระบบมีคำตอบเอกลักษณ์</text>
</svg>
