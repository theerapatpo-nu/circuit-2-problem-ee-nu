<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-label="แผนที่คำตอบกระแสเชิงสัญลักษณ์และเวลา" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">
<title>แผนที่คำตอบกระแสเชิงสัญลักษณ์และเวลา</title><defs><marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#172033"/></marker><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#059669"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker><marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/></marker><marker id="arr-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<rect width="1200" height="850" fill="#ffffff"/>
<text x="54.0" y="55.0" font-size="29" fill="#172033" text-anchor="start" font-weight="800" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">แผนที่คำตอบเชิงสัญลักษณ์</text>
<text x="54.0" y="86.0" font-size="16" fill="#64748b" text-anchor="start" font-weight="400" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">Iₖ=Nₖ/Δ แล้วแปลง rectangular → polar → time</text>
<line x1="54" y1="105" x2="1146" y2="105" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
<rect x="410" y="135" width="380" height="110" rx="18" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="600.0" y="180.0" font-size="28" fill="#b45309" text-anchor="middle" font-weight="800" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Δ=Δᵣ+jΔᵢ</text>
<text x="600.0" y="220.0" font-size="17" fill="#64748b" text-anchor="middle" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">θΔ=atan2(Δᵢ,Δᵣ)</text>
<rect x="55" y="300" width="220" height="190" rx="17" fill="#f8fafc" stroke="#dc2626" stroke-width="1.7"/>
<rect x="75" y="320" width="115" height="38" rx="19" fill="#dc2626" stroke="#dc2626" stroke-width="1"/>
<text x="132.5" y="345.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">N₁ / I₁</text>
<text x="75.0" y="405.0" font-size="15" fill="#172033" text-anchor="start" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">R₂(XL I₀−V₀)</text>
<text x="75.0" y="438.0" font-size="15" fill="#172033" text-anchor="start" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">+ jV₀(XC−XL)</text>
<rect x="345" y="300" width="220" height="190" rx="17" fill="#f8fafc" stroke="#2563eb" stroke-width="1.7"/>
<rect x="365" y="320" width="115" height="38" rx="19" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
<text x="422.5" y="345.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">N₂ / I₂</text>
<text x="365.0" y="405.0" font-size="15" fill="#172033" text-anchor="start" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">−XL R₂I₀</text>
<text x="365.0" y="438.0" font-size="15" fill="#172033" text-anchor="start" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">+ j(XL V₀+R₁R₂I₀)</text>
<rect x="635" y="300" width="220" height="190" rx="17" fill="#f8fafc" stroke="#059669" stroke-width="1.7"/>
<rect x="655" y="320" width="115" height="38" rx="19" fill="#059669" stroke="#059669" stroke-width="1"/>
<text x="712.5" y="345.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">N₃ / I₃</text>
<text x="655.0" y="405.0" font-size="15" fill="#172033" text-anchor="start" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">−N₂</text>
<text x="655.0" y="438.0" font-size="15" fill="#172033" text-anchor="start" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">I₃=−I₂</text>
<rect x="925" y="300" width="220" height="190" rx="17" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.7"/>
<rect x="945" y="320" width="115" height="38" rx="19" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/>
<text x="1002.5" y="345.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">N₄ / I₄</text>
<text x="945.0" y="405.0" font-size="15" fill="#172033" text-anchor="start" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">R₂V₀</text>
<text x="945.0" y="438.0" font-size="15" fill="#172033" text-anchor="start" font-weight="600" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">− j(V₀XC+R₁R₂I₀)</text>
<line x1="600" y1="515" x2="600" y2="565" stroke="#0891b2" stroke-width="4" stroke-linecap="round" marker-end="url(#arr-cyan)"/>
<rect x="115" y="580" width="970" height="170" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
<text x="600.0" y="625.0" font-size="23" fill="#172033" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">Aₖ = √(Nₖᵣ²+Nₖᵢ²) / √(Δᵣ²+Δᵢ²)</text>
<text x="600.0" y="675.0" font-size="22" fill="#7c3aed" text-anchor="middle" font-weight="700" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">φₖ = atan2(Nₖᵢ,Nₖᵣ) − atan2(Δᵢ,Δᵣ)</text>
<text x="600.0" y="724.0" font-size="27" fill="#2563eb" text-anchor="middle" font-weight="800" font-family="'STIX Two Math','Cambria Math','Times New Roman',serif">iₖ(t)=Aₖ cos(ωt+φₖ)</text>
<text x="600.0" y="805.0" font-size="17" fill="#64748b" text-anchor="middle" font-weight="650" font-family="'Noto Sans Thai','Sarabun','IBM Plex Sans Thai','Segoe UI',sans-serif">กิ่ง 3: A₃=A₂ และ φ₃=wrap(φ₂+180°)</text>
</svg>
