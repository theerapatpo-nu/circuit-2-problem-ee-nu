<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Cut-set Diagram — Problem 5</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff}
  body{font-family:"Noto Sans Thai","IBM Plex Sans Thai","Sarabun","Thonburi",system-ui,sans-serif}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="'Noto Sans Thai','IBM Plex Sans Thai','Sarabun','Thonburi',system-ui,sans-serif">
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a5276"/></marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f618d"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="arrM" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0,0 L13,6.5 L0,13 z" fill="#8e44ad"/></marker>
  </defs>

  <!-- ===== หัวเรื่อง ===== -->
  <rect x="0" y="0" width="1100" height="74" fill="#f4f8ff"/>
  <text x="550" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#0b2545">การตัดเส้น (Cut-set) บนกราฟ ข — วงข่ายความนำไฟฟ้า ข้อ 5</text>
  <text x="550" y="61" text-anchor="middle" font-size="15" fill="#44546a">tree = {1,3,4} (เส้นหนา) · link = {2,5} (เส้นบาง) · เส้นตัดสีม่วง c₁, c₂ ขีดขวางกิ่งที่ถูกตัด แล้ววงกลมปมไว้</text>

  <!-- ===== เส้นประวงกลมบอกอาณาเขต cut ===== -->
  <ellipse cx="300" cy="330" rx="215" ry="240" fill="none" stroke="#8e44ad" stroke-width="2.2" stroke-dasharray="9 8" opacity="0.5"/>
  <ellipse cx="800" cy="330" rx="215" ry="240" fill="none" stroke="#8e44ad" stroke-width="2.2" stroke-dasharray="9 8" opacity="0.5"/>

  <!-- ===== กิ่ง (หนา = twig, บาง = link) ===== -->
  <!-- กิ่ง 1 : e->a โค้งซ้าย (twig) -->
  <path d="M330 520 C 150 520, 150 170, 330 170" fill="none" stroke="#1a5276" stroke-width="5" marker-end="url(#arrG)"/>
  <rect x="112" y="284" width="52" height="30" rx="6" fill="#ffffff"/>
  <text x="138" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a5276">1</text>
  <rect x="96" y="416" width="108" height="26" rx="6" fill="#ffffff"/>
  <text x="150" y="434" text-anchor="middle" font-size="13" fill="#1a5276">G₁–E₁</text>

  <!-- กิ่ง 2 : a->b แนวนอน (link) -->
  <path d="M348 170 L 752 170" fill="none" stroke="#1f618d" stroke-width="3.5" marker-end="url(#arrB)"/>
  <rect x="520" y="138" width="60" height="30" rx="6" fill="#ffffff"/>
  <text x="550" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f618d">2</text>
  <rect x="498" y="196" width="104" height="26" rx="6" fill="#ffffff"/>
  <text x="550" y="214" text-anchor="middle" font-size="13" fill="#1f618d">E₃–G₂</text>

  <!-- กิ่ง 3 : a->e แนวตั้ง (twig) -->
  <path d="M330 200 L 330 500" fill="none" stroke="#c0392b" stroke-width="5" marker-end="url(#arrR)"/>
  <rect x="296" y="252" width="68" height="30" rx="6" fill="#ffffff"/>
  <text x="330" y="273" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">3</text>
  <rect x="276" y="400" width="48" height="26" rx="6" fill="#ffffff"/>
  <text x="300" y="418" text-anchor="middle" font-size="13" fill="#c0392b">G₃</text>

  <!-- กิ่ง 4 : b->e แนวตั้ง (twig) -->
  <path d="M770 200 L 770 500" fill="none" stroke="#c0392b" stroke-width="5" marker-end="url(#arrR)"/>
  <rect x="736" y="252" width="68" height="30" rx="6" fill="#ffffff"/>
  <text x="770" y="273" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">4</text>
  <rect x="796" y="400" width="48" height="26" rx="6" fill="#ffffff"/>
  <text x="820" y="418" text-anchor="middle" font-size="13" fill="#c0392b">G₄</text>

  <!-- กิ่ง 5 : b->e โค้งขวา (link) -->
  <path d="M770 520 C 950 520, 950 170, 770 170" fill="none" stroke="#1f618d" stroke-width="3.5" marker-end="url(#arrB)"/>
  <rect x="896" y="284" width="52" height="30" rx="6" fill="#ffffff"/>
  <text x="922" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f618d">5</text>
  <rect x="916" y="430" width="44" height="26" rx="6" fill="#ffffff"/>
  <text x="938" y="448" text-anchor="middle" font-size="13" fill="#1f618d">E₂</text>

  <!-- ===== ปม a, b, e ===== -->
  <circle cx="330" cy="170" r="26" fill="#ffffff" stroke="#0b2545" stroke-width="3.5"/>
  <text x="330" y="178" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b2545">a</text>
  <circle cx="770" cy="170" r="26" fill="#ffffff" stroke="#0b2545" stroke-width="3.5"/>
  <text x="770" y="178" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b2545">b</text>
  <circle cx="550" cy="520" r="26" fill="#ffffff" stroke="#0b2545" stroke-width="3.5"/>
  <text x="550" y="528" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b2545">e</text>
  <line x1="550" y1="548" x2="550" y2="562" stroke="#0b2545" stroke-width="3.5"/>
  <line x1="534" y1="562" x2="566" y2="562" stroke="#0b2545" stroke-width="3"/>
  <line x1="540" y1="570" x2="560" y2="570" stroke="#0b2545" stroke-width="3"/>
  <line x1="546" y1="578" x2="554" y2="578" stroke="#0b2545" stroke-width="3"/>
  <rect x="606" y="540" width="190" height="26" rx="6" fill="#ffffff"/>
  <text x="620" y="558" font-size="13" fill="#44546a">อ้างอิง Vₑ = 0 V</text>

  <!-- ===== เส้นตัด c1 (แยกปม a ออกจาก b,e) ===== -->
  <line x1="60" y1="30" x2="510" y2="560" stroke="#8e44ad" stroke-width="6" marker-start="url(#arrM)" marker-end="url(#arrM)"/>
  <!-- × จุดที่ตัดข้ามกิ่ง -->
  <g stroke="#8e44ad" stroke-width="3">
    <line x1="406" y1="151" x2="434" y2="179"/><line x1="434" y1="151" x2="406" y2="179"/>
    <line x1="316" y1="326" x2="344" y2="354"/><line x1="344" y1="326" x2="316" y2="354"/>
    <line x1="234" y1="424" x2="262" y2="452"/><line x1="262" y1="424" x2="234" y2="452"/>
  </g>
  <rect x="78" y="84" width="40" height="32" rx="6" fill="#ffffff"/>
  <text x="98" y="106" text-anchor="middle" font-size="19" font-weight="bold" fill="#8e44ad">c₁</text>
  <rect x="196" y="52" width="170" height="26" rx="6" fill="#ffffff"/>
  <text x="281" y="70" text-anchor="middle" font-size="13" fill="#8e44ad">ตัดกิ่ง 1, 2, 3</text>
  <text x="446" y="150" font-size="12" fill="#8e44ad">× 1</text>
  <text x="352" y="360" font-size="12" fill="#8e44ad">× 2</text>
  <text x="190" y="470" font-size="12" fill="#8e44ad">× 3</text>

  <!-- ===== เส้นตัด c2 (แยกปม b ออกจาก a,e) ===== -->
  <line x1="1040" y1="30" x2="590" y2="560" stroke="#8e44ad" stroke-width="6" marker-start="url(#arrM)" marker-end="url(#arrM)"/>
  <g stroke="#8e44ad" stroke-width="3">
    <line x1="666" y1="151" x2="694" y2="179"/><line x1="694" y1="151" x2="666" y2="179"/>
    <line x1="756" y1="326" x2="784" y2="354"/><line x1="784" y1="326" x2="756" y2="354"/>
    <line x1="786" y1="371" x2="814" y2="399"/><line x1="814" y1="371" x2="786" y2="399"/>
  </g>
  <rect x="962" y="84" width="40" height="32" rx="6" fill="#ffffff"/>
  <text x="982" y="106" text-anchor="middle" font-size="19" font-weight="bold" fill="#8e44ad">c₂</text>
  <rect x="734" y="52" width="170" height="26" rx="6" fill="#ffffff"/>
  <text x="819" y="70" text-anchor="middle" font-size="13" fill="#8e44ad">ตัดกิ่ง 2, 4, 5</text>
  <text x="652" y="150" font-size="12" fill="#8e44ad">× 1</text>
  <text x="790" y="362" font-size="12" fill="#8e44ad">× 2</text>
  <text x="820" y="408" font-size="12" fill="#8e44ad">× 3</text>

  <!-- ===== สมการ KCL กำกับแต่ละ cut ===== -->
  <rect x="50" y="592" width="480" height="62" rx="10" fill="#f7f0ff" stroke="#8e44ad" stroke-width="2"/>
  <text x="70" y="618" font-size="15" font-weight="bold" fill="#4a235a">Cut c₁ (วงรอบปม a): i₁ − i₃ − i₂ = 0</text>
  <text x="70" y="641" font-size="13" fill="#4a235a">+1 = กระแสออกจากปม a · −1 = กระแสเข้าปม a → แถว QG = [−1, 1, 1, 0]</text>

  <rect x="570" y="592" width="480" height="62" rx="10" fill="#f7f0ff" stroke="#8e44ad" stroke-width="2"/>
  <text x="590" y="618" font-size="15" font-weight="bold" fill="#4a235a">Cut c₂ (วงรอบปม b): i₂ − i₄ − i₅ = 0</text>
  <text x="590" y="641" font-size="13" fill="#4a235a">i₅ = กระแส E₂ · กิ่ง 5 ไม่ใส่ใน QG เก็บเป็น constraint Vᵦ = −E₂</text>

  <!-- ===== หลักการวง (วิธีคิด) ===== -->
  <rect x="50" y="674" width="1000" height="112" rx="12" fill="#fbfdff" stroke="#b7c9e2" stroke-width="2"/>
  <text x="78" y="702" font-size="16" font-weight="bold" fill="#0b2545">หลักการวง: ตัด "วงปม" ทีละปมอิสระออกจากส่วนที่เหลือ — กิ่งที่เส้นตัดข้าม = สมาชิกของ cut-set</text>
  <text x="78" y="728" font-size="14" fill="#33475f">• ปมอิสระมี 2 ปม (a, b) ⇒ ตัด 2 เส้น (c₁, c₂) ⇒ เมทริกซ์ QG ขนาด 2×4 สำหรับกิ่งความนำ [1,2,3,4]</text>
  <text x="78" y="752" font-size="14" fill="#33475f">• เลือก tree = {1,3,4} (เส้นหนา) ต่อปมทุกปมโดยไม่เกิดวงปิด · link = {2,5} (เส้นบาง) ⇒ ตัดครั้งละ 1 link ได้ fundamental cut-set</text>
  <text x="78" y="776" font-size="14" fill="#33475f">• c₁ ตัด {1,2,3} → KCL ปม a · c₂ ตัด {2,4,5} → KCL ปม b · ตรวจได้ว่า QG Yb QGᵀ = [G₁+G₂+G₃, −G₂; −G₂, G₂+G₄]</text>
</svg>
</body>
</html>
